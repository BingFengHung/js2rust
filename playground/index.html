<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>js-to-rust Playground 🦀</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <style>
    :root {
      --bg-dark: #12141a;
      --bg-sidebar: #15181f;
      --bg-panel: #1a1d24;
      --bg-editor: #16181f;
      --border-color: #2b303c;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --accent-rust: #e05d44;
      --accent-green: #2ea043;
      --accent-green-hover: #3fb950;
      --accent-blue: #58a6ff;
      --tree-hover: #21262d;
      --tree-active: #1f242c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .brand span.crab {
      font-size: 1.4rem;
    }

    .badge {
      font-size: 0.72rem;
      background-color: rgba(224, 93, 68, 0.15);
      color: var(--accent-rust);
      border: 1px solid rgba(224, 93, 68, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select {
      background: var(--bg-editor);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-run {
      background-color: var(--accent-green);
      color: #fff;
    }

    .btn-run:hover:not(:disabled) {
      background-color: var(--accent-green-hover);
    }

    .btn-run:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #30363d;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr 1fr;
      overflow: hidden;
    }

    /* Left Sidebar: File Tree Explorer */
    aside.sidebar {
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      background-color: var(--bg-panel);
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
    }

    .sidebar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.1s ease;
    }

    .sidebar-icon-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      background: rgba(88, 166, 255, 0.1);
    }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    /* Tree Node Elements */
    .tree-node-folder {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #8b949e;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s ease;
    }

    .tree-node-folder:hover {
      background-color: var(--tree-hover);
      color: var(--text-main);
    }

    .folder-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-arrow {
      font-size: 0.65rem;
      width: 12px;
      display: inline-block;
      transition: transform 0.15s ease;
    }

    .tree-node-file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
      font-size: 0.82rem;
      color: #c9d1d9;
      cursor: pointer;
      border-left: 3px solid transparent;
      user-select: none;
      transition: background 0.1s ease;
    }

    .tree-node-file:hover {
      background-color: var(--tree-hover);
    }

    .tree-node-file.active {
      background-color: var(--tree-active);
      color: #fff;
      border-left-color: var(--accent-blue);
      font-weight: 600;
    }

    .file-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-icon-js {
      color: #f7df1e;
      font-weight: 700;
      font-size: 0.7rem;
      background: rgba(247, 223, 30, 0.12);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .btn-delete-node {
      opacity: 0;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 0.75rem;
    }

    .tree-node-file:hover .btn-delete-node,
    .tree-node-folder:hover .btn-delete-node {
      opacity: 0.7;
    }

    .btn-delete-node:hover {
      opacity: 1 !important;
      color: #f85149;
    }

    /* Middle & Right Panels */
    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      background-color: var(--bg-panel);
      padding: 0 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
    }

    .active-tab-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .editor-container {
      flex: 1;
      position: relative;
      display: flex;
      background: var(--bg-editor);
      overflow: hidden;
    }

    textarea#jsInput {
      width: 100%;
      height: 100%;
      background: transparent;
      color: #e6edf3;
      font-family: "Fira Code", "Cascadia Code", Consolas, Monaco, monospace;
      font-size: 13.5px;
      line-height: 1.6;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }

    .right-split {
      display: grid;
      grid-template-rows: 1fr 240px;
      height: 100%;
      overflow: hidden;
    }

    .rust-preview {
      background: var(--bg-editor);
      overflow: auto;
      position: relative;
      padding: 0;
    }

    pre#rustCode {
      margin: 0;
      padding: 16px;
      background: transparent !important;
      font-family: "Fira Code", "Cascadia Code", Consolas, Monaco, monospace;
      font-size: 13.5px;
      line-height: 1.6;
      height: 100%;
      overflow: auto;
    }

    .terminal-panel {
      background: #0d1117;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .terminal-header {
      background: #161b22;
      padding: 6px 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .terminal-output {
      flex: 1;
      padding: 12px 16px;
      font-family: "Fira Code", Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .status-tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-idle { background: #21262d; color: #8b949e; }
    .status-running { background: #1f6feb33; color: #58a6ff; }
    .status-success { background: #23863633; color: #3fb950; }
    .status-error { background: #da363333; color: #f85149; }

    .stdout-text { color: #56d364; }
    .stderr-text { color: #8b949e; }
    .error-text { color: #f85149; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="crab">🦀</span>
      <span>js-to-rust Playground</span>
      <span class="badge">v0.4.0 (Folder Tree)</span>
    </div>

    <div class="actions">
      <label for="templateSelect" style="font-size: 0.82rem; color: var(--text-muted);">選擇專案範本：</label>
      <select id="templateSelect">
        <option value="nested">📂 巢狀資料夾架構 (src/utils/math.js)</option>
        <option value="modules">📦 基本模組架構 (src/math.js)</option>
        <option value="inference">🧠 免註解型別推導 (Type Inference)</option>
        <option value="advanced">🔥 結構體與可變借用 (Struct & &mut)</option>
        <option value="custom">自訂空白專案 (Empty)</option>
      </select>

      <button id="copyBtn" class="btn btn-secondary">📋 複製 Rust 代碼</button>

      <button id="runBtn" class="btn btn-run">
        <span id="runIcon">▶</span>
        <span>在線編譯並執行 Rust</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Left: File & Folder Tree Explorer Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>專案目錄 (EXPLORER)</span>
        <div class="sidebar-actions">
          <button id="addFileBtn" class="sidebar-icon-btn" title="新增檔案">+ 檔案</button>
          <button id="addFolderBtn" class="sidebar-icon-btn" title="新增資料夾">+ 資料夾</button>
        </div>
      </div>
      <div class="tree-container" id="treeView">
        <!-- Dynamically rendered folder tree -->
      </div>
    </aside>

    <!-- Center: JavaScript Code Editor for Selected File -->
    <div class="panel">
      <div class="panel-header">
        <div class="active-tab-title">
          <span class="file-icon-js">JS</span>
          <span id="activeFilePath">src/main.js</span>
        </div>
        <span style="font-size: 0.75rem; color: #58a6ff;">即時編譯 (Live)</span>
      </div>
      <div class="editor-container">
        <textarea id="jsInput" spellcheck="false" placeholder="在此輸入你的 JavaScript 演算法..."></textarea>
      </div>
    </div>

    <!-- Right: Generated Rust Code & Output -->
    <div class="panel">
      <div class="right-split">
        <!-- Rust Code View -->
        <div style="display: flex; flex-direction: column; overflow: hidden;">
          <div class="panel-header">
            <span>轉譯產生的 Rust 模組樹與主程式</span>
            <span id="transpileStatus" style="font-size: 0.75rem; color: #3fb950;">轉譯完成</span>
          </div>
          <div class="rust-preview">
            <pre><code id="rustCode" class="language-rust"></code></pre>
          </div>
        </div>

        <!-- Terminal Output -->
        <div class="terminal-panel">
          <div class="terminal-header">
            <span>官方 Rust Playground 執行結果</span>
            <span id="execBadge" class="status-tag status-idle">等待執行</span>
          </div>
          <div id="terminalOutput" class="terminal-output">點擊上方「▶ 在線編譯並執行 Rust」按鈕，立即透過 Rust 官方 Playground 進行線上編譯與執行！</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Templates for different scenarios
    const TEMPLATES = {
      nested: {
        folders: ['src', 'src/utils'],
        files: {
          'src/main.js': `// 從巢狀資料夾 src/utils/math.js 引入模組
import { add, multiply } from './utils/math.js';

function main() {
  const sum = add(30, 70);
  console.log("從 utils/math 呼叫 30 + 70 =", sum);

  const product = multiply(6, 9);
  console.log("從 utils/math 呼叫 6 * 9 =", product);
}`,
          'src/utils/math.js': `/**
 * 位於 src/utils 資料夾下的數學模組
 */
export function add(a, b) {
  return a + b;
}

export function multiply(a, b) {
  return a * b;
}`
        }
      },

      modules: {
        folders: ['src'],
        files: {
          'src/main.js': `import { add, multiply } from './math.js';

function main() {
  const sum = add(15, 25);
  console.log("15 + 25 =", sum);
}`,
          'src/math.js': `export function add(a, b) {
  return a + b;
}

export function multiply(a, b) {
  return a * b;
}`
        }
      },

      inference: {
        folders: ['src'],
        files: {
          'src/main.js': `// 💡 免註解型別推導：自動依呼叫點參數推導型別
function ask(greet) {
  console.log("Greeting:", greet);
}

function main() {
  ask("Hello from Type Inference!");
}`
        }
      },

      advanced: {
        folders: ['src'],
        files: {
          'src/main.js': `/**
 * @typedef {Object} Point
 * @property {float} x
 * @property {float} y
 */

function distanceFromOrigin(p) {
  return Math.sqrt(p.x * p.x + p.y * p.y);
}

function main() {
  const pt = { x: 3.0, y: 4.0 };
  console.log("Distance =", distanceFromOrigin(pt));
}`
        }
      },

      custom: {
        folders: ['src'],
        files: {
          'src/main.js': `function main() {
  console.log("Hello, World!");
}`
        }
      }
    };

    // State
    let currentTemplate = TEMPLATES.nested;
    let folders = new Set(currentTemplate.folders);
    let files = JSON.parse(JSON.stringify(currentTemplate.files));
    let collapsedFolders = new Set();
    let activeFile = 'src/main.js';
    let currentRustCode = '';
    let debounceTimer = null;

    const treeView = document.getElementById('treeView');
    const activeFilePath = document.getElementById('activeFilePath');
    const addFileBtn = document.getElementById('addFileBtn');
    const addFolderBtn = document.getElementById('addFolderBtn');
    const jsInput = document.getElementById('jsInput');
    const rustCode = document.getElementById('rustCode');
    const transpileStatus = document.getElementById('transpileStatus');
    const templateSelect = document.getElementById('templateSelect');
    const runBtn = document.getElementById('runBtn');
    const runIcon = document.getElementById('runIcon');
    const copyBtn = document.getElementById('copyBtn');
    const execBadge = document.getElementById('execBadge');
    const terminalOutput = document.getElementById('terminalOutput');

    /**
     * Build nested tree data structure from folders and files
     */
    function buildTreeData() {
      const root = { name: 'src', path: 'src', type: 'folder', children: {} };

      // Ensure all folders exist in tree
      folders.forEach((folderPath) => {
        const parts = folderPath.split('/');
        let curr = root;
        let currPath = '';
        for (let i = 0; i < parts.length; i++) {
          const part = parts[i];
          currPath = currPath ? `${currPath}/${part}` : part;
          if (currPath === 'src') continue;
          if (!curr.children[part]) {
            curr.children[part] = { name: part, path: currPath, type: 'folder', children: {} };
          }
          curr = curr.children[part];
        }
      });

      // Insert all files
      Object.keys(files).forEach((filePath) => {
        const parts = filePath.split('/');
        let curr = root;
        for (let i = 0; i < parts.length; i++) {
          const part = parts[i];
          if (i === 0 && part === 'src') continue;
          if (i === parts.length - 1) {
            curr.children[part] = { name: part, path: filePath, type: 'file' };
          } else {
            if (!curr.children[part]) {
              curr.children[part] = { name: part, path: parts.slice(0, i + 1).join('/'), type: 'folder', children: {} };
            }
            curr = curr.children[part];
          }
        }
      });

      return root;
    }

    /**
     * Render the folder tree visually
     */
    function renderTree() {
      treeView.innerHTML = '';
      const root = buildTreeData();

      function renderNode(node, depth = 0) {
        const indentPx = depth * 14;

        if (node.type === 'folder') {
          const isCollapsed = collapsedFolders.has(node.path);
          const folderDiv = document.createElement('div');
          folderDiv.className = 'tree-node-folder';
          folderDiv.style.paddingLeft = `${12 + indentPx}px`;

          const left = document.createElement('div');
          left.className = 'folder-left';
          left.innerHTML = `
            <span class="folder-arrow">${isCollapsed ? '▶' : '▼'}</span>
            <span>📁</span>
            <span>${node.name}</span>
          `;
          folderDiv.appendChild(left);

          // Allow deleting custom subfolders (not src)
          if (node.path !== 'src') {
            const delBtn = document.createElement('span');
            delBtn.className = 'btn-delete-node';
            delBtn.innerHTML = '🗑️';
            delBtn.title = '刪除資料夾及其內容';
            delBtn.onclick = (e) => {
              e.stopPropagation();
              if (confirm(`確定要刪除資料夾 ${node.path} 及其所有內容嗎？`)) {
                // Delete files under folder
                Object.keys(files).forEach((f) => {
                  if (f.startsWith(node.path + '/')) delete files[f];
                });
                folders.delete(node.path);
                if (activeFile.startsWith(node.path + '/')) {
                  activeFile = 'src/main.js';
                }
                renderTree();
                activeFilePath.textContent = activeFile;
                jsInput.value = files[activeFile] || '';
                doTranspile();
              }
            };
            folderDiv.appendChild(delBtn);
          }

          folderDiv.onclick = () => {
            if (collapsedFolders.has(node.path)) {
              collapsedFolders.delete(node.path);
            } else {
              collapsedFolders.add(node.path);
            }
            renderTree();
          };

          treeView.appendChild(folderDiv);

          // Render children if not collapsed
          if (!isCollapsed) {
            const sortedKeys = Object.keys(node.children).sort((a, b) => {
              const nodeA = node.children[a];
              const nodeB = node.children[b];
              if (nodeA.type !== nodeB.type) return nodeA.type === 'folder' ? -1 : 1;
              return a.localeCompare(b);
            });

            sortedKeys.forEach((key) => {
              renderNode(node.children[key], depth + 1);
            });
          }
        } else if (node.type === 'file') {
          const fileDiv = document.createElement('div');
          fileDiv.className = `tree-node-file ${node.path === activeFile ? 'active' : ''}`;
          fileDiv.style.paddingLeft = `${16 + indentPx}px`;

          const left = document.createElement('div');
          left.className = 'file-left';
          left.innerHTML = `<span class="file-icon-js">JS</span><span>${node.name}</span>`;
          fileDiv.appendChild(left);

          // Delete button for non-main files
          if (node.path !== 'src/main.js' && node.name !== 'main.js') {
            const delBtn = document.createElement('span');
            delBtn.className = 'btn-delete-node';
            delBtn.innerHTML = '🗑️';
            delBtn.title = '刪除檔案';
            delBtn.onclick = (e) => {
              e.stopPropagation();
              if (confirm(`確定要刪除 ${node.path} 嗎？`)) {
                delete files[node.path];
                if (activeFile === node.path) {
                  activeFile = 'src/main.js';
                }
                renderTree();
                activeFilePath.textContent = activeFile;
                jsInput.value = files[activeFile] || '';
                doTranspile();
              }
            };
            fileDiv.appendChild(delBtn);
          }

          fileDiv.onclick = () => {
            files[activeFile] = jsInput.value;
            activeFile = node.path;
            renderTree();
            activeFilePath.textContent = activeFile;
            jsInput.value = files[activeFile] || '';
            doTranspile();
          };

          treeView.appendChild(fileDiv);
        }
      }

      renderNode(root, 0);
    }

    // Add Folder Action
    addFolderBtn.onclick = () => {
      const folderName = prompt('請輸入要新增在 src/ 下的資料夾名稱 (例如 utils 或 helpers):');
      if (folderName && folderName.trim()) {
        const clean = folderName.trim().replace(/^\//, '').replace(/\/$/, '');
        const fullPath = `src/${clean}`;
        folders.add(fullPath);
        renderTree();
      }
    };

    // Add File Action
    addFileBtn.onclick = () => {
      const fileName = prompt('請輸入要新增的檔案路徑 (例如 calc.js 或 utils/calc.js):', 'calc.js');
      if (fileName && fileName.trim()) {
        let clean = fileName.trim().replace(/^\//, '');
        if (!clean.endsWith('.js')) clean += '.js';

        const fullPath = clean.startsWith('src/') ? clean : `src/${clean}`;

        if (files[fullPath]) {
          alert('該檔案已存在！');
          return;
        }

        // Auto add parent folders if needed
        const parts = fullPath.split('/');
        if (parts.length > 2) {
          const parentFolder = parts.slice(0, parts.length - 1).join('/');
          folders.add(parentFolder);
        }

        const baseModName = parts[parts.length - 1].replace('.js', '');
        files[fullPath] = `/**\n * ${baseModName} 模組\n */\nexport function calc() {\n  return 42;\n}\n`;
        activeFile = fullPath;
        renderTree();
        activeFilePath.textContent = activeFile;
        jsInput.value = files[activeFile];
        doTranspile();
      }
    };

    // Template change handler
    templateSelect.addEventListener('change', (e) => {
      const sel = e.target.value;
      if (TEMPLATES[sel]) {
        currentTemplate = TEMPLATES[sel];
        folders = new Set(currentTemplate.folders);
        files = JSON.parse(JSON.stringify(currentTemplate.files));
        activeFile = Object.keys(files)[0] || 'src/main.js';
        renderTree();
        activeFilePath.textContent = activeFile;
        jsInput.value = files[activeFile];
        doTranspile();
      }
    });

    // Handle input with debounce
    jsInput.addEventListener('input', () => {
      files[activeFile] = jsInput.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(doTranspile, 250);
    });

    // Handle Tab key
    jsInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = jsInput.selectionStart;
        const end = jsInput.selectionEnd;
        jsInput.value = jsInput.value.substring(0, start) + '  ' + jsInput.value.substring(end);
        jsInput.selectionStart = jsInput.selectionEnd = start + 2;
        files[activeFile] = jsInput.value;
        doTranspile();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runRustCode();
      }
    });

    // Transpile all files into Rust
    async function doTranspile() {
      try {
        transpileStatus.textContent = '轉譯中...';
        transpileStatus.style.color = '#58a6ff';

        const res = await fetch('/api/transpile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ files })
        });

        const data = await res.json();
        if (data.error) {
          transpileStatus.textContent = '轉譯語法錯誤';
          transpileStatus.style.color = '#f85149';
          rustCode.textContent = `// 轉譯錯誤:\n// ${data.error}`;
        } else {
          currentRustCode = data.rust;
          rustCode.textContent = data.rust;
          transpileStatus.textContent = '轉譯完成';
          transpileStatus.style.color = '#3fb950';
          hljs.highlightElement(rustCode);
        }
      } catch (err) {
        transpileStatus.textContent = '連線失敗';
        transpileStatus.style.color = '#f85149';
      }
    }

    // Run Rust code via online compiler API
    async function runRustCode() {
      if (!currentRustCode || currentRustCode.trim() === '') {
        alert('請先輸入 JavaScript 程式碼以產生 Rust！');
        return;
      }

      runBtn.disabled = true;
      runIcon.innerHTML = '<span class="spinner"></span>';
      execBadge.className = 'status-tag status-running';
      execBadge.textContent = '編譯並執行中...';
      terminalOutput.innerHTML = '<span class="stderr-text">正在向官方 Rust Playground 發送請求編譯並執行...</span>';

      try {
        const payload = {
          channel: "stable",
          mode: "debug",
          edition: "2021",
          crateType: "bin",
          tests: false,
          code: currentRustCode
        };

        const res = await fetch('https://play.rust-lang.org/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
          execBadge.className = 'status-tag status-success';
          execBadge.textContent = '執行成功 (Status: 0)';

          let outputHtml = '';
          if (data.stdout) {
            outputHtml += `<div class="stdout-text"><strong>[執行輸出 stdout]:</strong>\n${escapeHtml(data.stdout)}</div>\n`;
          }
          if (data.stderr) {
            outputHtml += `<div class="stderr-text"><strong>[編譯訊息 stderr]:</strong>\n${escapeHtml(data.stderr)}</div>`;
          }
          terminalOutput.innerHTML = outputHtml || '<span class="stdout-text">程式執行完畢，無輸出內容。</span>';
        } else {
          execBadge.className = 'status-tag status-error';
          execBadge.textContent = '編譯/執行失敗';
          terminalOutput.innerHTML = `<div class="error-text"><strong>[錯誤訊息]:</strong>\n${escapeHtml(data.stderr || data.stdout || '未知錯誤')}</div>`;
        }
      } catch (err) {
        execBadge.className = 'status-tag status-error';
        execBadge.textContent = '連線錯誤';
        terminalOutput.innerHTML = `<div class="error-text">無法連接到 Rust Playground API: ${escapeHtml(err.message)}</div>`;
      } finally {
        runBtn.disabled = false;
        runIcon.textContent = '▶';
      }
    }

    runBtn.addEventListener('click', runRustCode);

    copyBtn.addEventListener('click', () => {
      if (!currentRustCode) return;
      navigator.clipboard.writeText(currentRustCode).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✓ 已複製！';
        setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
      });
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Init
    renderTree();
    activeFilePath.textContent = activeFile;
    jsInput.value = files[activeFile] || '';
    doTranspile();
  </script>
</body>
</html>
