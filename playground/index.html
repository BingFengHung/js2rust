<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>js-to-rust Playground 🦀</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <style>
    :root {
      --bg-dark: #12141a;
      --bg-sidebar: #15181f;
      --bg-panel: #1a1d24;
      --bg-editor: #16181f;
      --border-color: #2b303c;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --accent-rust: #e05d44;
      --accent-green: #2ea043;
      --accent-green-hover: #3fb950;
      --accent-blue: #58a6ff;
      --tree-hover: #21262d;
      --tree-active: #1f242c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .brand span.crab {
      font-size: 1.4rem;
    }

    .badge {
      font-size: 0.72rem;
      background-color: rgba(224, 93, 68, 0.15);
      color: var(--accent-rust);
      border: 1px solid rgba(224, 93, 68, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select {
      background: var(--bg-editor);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-run {
      background-color: var(--accent-green);
      color: #fff;
    }

    .btn-run:hover:not(:disabled) {
      background-color: var(--accent-green-hover);
    }

    .btn-run:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #30363d;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr 1fr;
      overflow: hidden;
    }

    /* Left Sidebar: File Tree Explorer */
    aside.sidebar {
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      background-color: var(--bg-panel);
      padding: 8px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
    }

    .sidebar-btn-add {
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid rgba(88, 166, 255, 0.3);
      color: var(--accent-blue);
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .sidebar-btn-add:hover {
      background: rgba(88, 166, 255, 0.2);
    }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .tree-root {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
    }

    .tree-file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px 6px 28px;
      font-size: 0.83rem;
      color: #c9d1d9;
      cursor: pointer;
      border-left: 3px solid transparent;
      user-select: none;
      transition: background 0.1s ease;
    }

    .tree-file:hover {
      background-color: var(--tree-hover);
    }

    .tree-file.active {
      background-color: var(--tree-active);
      color: #fff;
      border-left-color: var(--accent-blue);
      font-weight: 600;
    }

    .tree-file-name {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-icon-js {
      color: #f7df1e;
      font-weight: 700;
      font-size: 0.75rem;
      background: rgba(247, 223, 30, 0.12);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .btn-delete-file {
      opacity: 0;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 0.8rem;
    }

    .tree-file:hover .btn-delete-file {
      opacity: 0.7;
    }

    .btn-delete-file:hover {
      opacity: 1 !important;
      color: #f85149;
    }

    /* Middle & Right Panels */
    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      background-color: var(--bg-panel);
      padding: 0 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
    }

    .active-tab-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .editor-container {
      flex: 1;
      position: relative;
      display: flex;
      background: var(--bg-editor);
      overflow: hidden;
    }

    textarea#jsInput {
      width: 100%;
      height: 100%;
      background: transparent;
      color: #e6edf3;
      font-family: "Fira Code", "Cascadia Code", Consolas, Monaco, monospace;
      font-size: 13.5px;
      line-height: 1.6;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }

    .right-split {
      display: grid;
      grid-template-rows: 1fr 240px;
      height: 100%;
      overflow: hidden;
    }

    .rust-preview {
      background: var(--bg-editor);
      overflow: auto;
      position: relative;
      padding: 0;
    }

    pre#rustCode {
      margin: 0;
      padding: 16px;
      background: transparent !important;
      font-family: "Fira Code", "Cascadia Code", Consolas, Monaco, monospace;
      font-size: 13.5px;
      line-height: 1.6;
      height: 100%;
      overflow: auto;
    }

    .terminal-panel {
      background: #0d1117;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .terminal-header {
      background: #161b22;
      padding: 6px 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .terminal-output {
      flex: 1;
      padding: 12px 16px;
      font-family: "Fira Code", Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .status-tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-idle { background: #21262d; color: #8b949e; }
    .status-running { background: #1f6feb33; color: #58a6ff; }
    .status-success { background: #23863633; color: #3fb950; }
    .status-error { background: #da363333; color: #f85149; }

    .stdout-text { color: #56d364; }
    .stderr-text { color: #8b949e; }
    .error-text { color: #f85149; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="crab">🦀</span>
      <span>js-to-rust Playground</span>
      <span class="badge">v0.3.0 (Tree View)</span>
    </div>

    <div class="actions">
      <label for="templateSelect" style="font-size: 0.82rem; color: var(--text-muted);">選擇專案範本：</label>
      <select id="templateSelect">
        <option value="modules">📦 模組化樹狀專案 (main.js + math.js)</option>
        <option value="inference">🧠 免註解型別推導 (Type Inference)</option>
        <option value="advanced">🔥 結構體與可變借用 (Struct & &mut)</option>
        <option value="fibonacci">遞迴斐波那契數列 (Fibonacci)</option>
        <option value="custom">自訂空白專案 (Empty)</option>
      </select>

      <button id="copyBtn" class="btn btn-secondary">📋 複製 Rust 代碼</button>

      <button id="runBtn" class="btn btn-run">
        <span id="runIcon">▶</span>
        <span>在線編譯並執行 Rust</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Left: File Tree Explorer Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>專案檔案 (EXPLORER)</span>
        <button id="addFileBtn" class="sidebar-btn-add" title="在 src 目錄下新增模組檔案">+ 新增檔案</button>
      </div>
      <div class="tree-container">
        <div class="tree-root">
          <span>📁 src</span>
        </div>
        <div id="fileTree">
          <!-- Dynamically populated files -->
        </div>
      </div>
    </aside>

    <!-- Center: JavaScript Code Editor for Selected File -->
    <div class="panel">
      <div class="panel-header">
        <div class="active-tab-title">
          <span class="file-icon-js">JS</span>
          <span id="activeFileName">main.js</span>
        </div>
        <span style="font-size: 0.75rem; color: #58a6ff;">即時編譯 (Live)</span>
      </div>
      <div class="editor-container">
        <textarea id="jsInput" spellcheck="false" placeholder="在此輸入你的 JavaScript 演算法..."></textarea>
      </div>
    </div>

    <!-- Right: Generated Rust Code & Output -->
    <div class="panel">
      <div class="right-split">
        <!-- Rust Code View -->
        <div style="display: flex; flex-direction: column; overflow: hidden;">
          <div class="panel-header">
            <span>轉譯產生的 Rust 模組樹與主程式</span>
            <span id="transpileStatus" style="font-size: 0.75rem; color: #3fb950;">轉譯完成</span>
          </div>
          <div class="rust-preview">
            <pre><code id="rustCode" class="language-rust"></code></pre>
          </div>
        </div>

        <!-- Terminal Output -->
        <div class="terminal-panel">
          <div class="terminal-header">
            <span>官方 Rust Playground 執行結果</span>
            <span id="execBadge" class="status-tag status-idle">等待執行</span>
          </div>
          <div id="terminalOutput" class="terminal-output">點擊上方「▶ 在線編譯並執行 Rust」按鈕，立即透過 Rust 官方 Playground 進行線上編譯與執行！</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Templates for different scenarios
    const TEMPLATES = {
      modules: {
        'main.js': `import { add, multiply } from './math.js';

function main() {
  const sum = add(15, 25);
  console.log("從 math 模組計算 15 + 25 =", sum);

  const product = multiply(7, 8);
  console.log("從 math 模組計算 7 * 8 =", product);
}`,
        'math.js': `/**
 * 數學計算模組
 */
export function add(a, b) {
  return a + b;
}

export function multiply(a, b) {
  return a * b;
}`
      },

      inference: {
        'main.js': `// 💡 點擊左側檔案樹可查看不同檔案。完全不需要寫 JSDoc！
function ask(greet) {
  console.log("Greeting:", greet);
}

function calculateTax(price, rate) {
  return price * rate;
}

function processScores(scores) {
  let total = 0;
  for (let i = 0; i < scores.length; i++) {
    total += scores[i];
  }
  return total;
}

function main() {
  // 自動推導 greet 為 &str
  ask("Hello from Type Inference!");

  // 自動推導 price 和 rate 為數值
  const tax = calculateTax(100.0, 0.05);
  console.log("Tax =", tax);

  // 自動推導 scores 為 &[i64] 並自動傳入借用 &
  const myScores = [90, 85, 95];
  const sum = processScores(myScores);
  console.log("Total Score =", sum);
}`
      },

      advanced: {
        'main.js': `/**
 * @typedef {Object} Point
 * @property {float} x
 * @property {float} y
 */

function distanceFromOrigin(p) {
  return Math.sqrt(p.x * p.x + p.y * p.y);
}

function resetFirst(arr) {
  arr[0] = 0;
}

function getStatus(code) {
  switch (code) {
    case 200:
      return "OK";
    default:
      return "ERROR";
  }
}

function main() {
  const pt = { x: 3.0, y: 4.0 };
  console.log("Distance =", distanceFromOrigin(pt));

  let numbers = [100, 200, 300];
  resetFirst(numbers);
  console.log("After resetFirst =", numbers);

  console.log("Status 200 =", getStatus(200));
}`
      },

      fibonacci: {
        'main.js': `function fibonacci(n) {
  if (n <= 1) return n;
  return fibonacci(n - 1) + fibonacci(n - 2);
}

function main() {
  console.log("Fibonacci(10) =", fibonacci(10));
}`
      },

      custom: {
        'main.js': `function main() {
  console.log("Hello, World!");
}`
      }
    };

    // State
    let files = JSON.parse(JSON.stringify(TEMPLATES.modules));
    let activeFile = 'main.js';
    let currentRustCode = '';
    let debounceTimer = null;

    const fileTree = document.getElementById('fileTree');
    const activeFileName = document.getElementById('activeFileName');
    const addFileBtn = document.getElementById('addFileBtn');
    const jsInput = document.getElementById('jsInput');
    const rustCode = document.getElementById('rustCode');
    const transpileStatus = document.getElementById('transpileStatus');
    const templateSelect = document.getElementById('templateSelect');
    const runBtn = document.getElementById('runBtn');
    const runIcon = document.getElementById('runIcon');
    const copyBtn = document.getElementById('copyBtn');
    const execBadge = document.getElementById('execBadge');
    const terminalOutput = document.getElementById('terminalOutput');

    function renderTree() {
      fileTree.innerHTML = '';
      const filenames = Object.keys(files);

      filenames.forEach((filename) => {
        const item = document.createElement('div');
        item.className = `tree-file ${filename === activeFile ? 'active' : ''}`;

        const nameContainer = document.createElement('div');
        nameContainer.className = 'tree-file-name';
        nameContainer.innerHTML = `<span class="file-icon-js">JS</span><span>${filename}</span>`;
        item.appendChild(nameContainer);

        // Delete button for non-main files
        if (filename !== 'main.js') {
          const deleteBtn = document.createElement('span');
          deleteBtn.className = 'btn-delete-file';
          deleteBtn.innerHTML = '🗑️';
          deleteBtn.title = '刪除檔案';
          deleteBtn.onclick = (e) => {
            e.stopPropagation();
            if (confirm(`確定要刪除 ${filename} 嗎？`)) {
              delete files[filename];
              if (activeFile === filename) {
                activeFile = 'main.js';
              }
              renderTree();
              activeFileName.textContent = activeFile;
              jsInput.value = files[activeFile] || '';
              doTranspile();
            }
          };
          item.appendChild(deleteBtn);
        }

        item.onclick = () => {
          files[activeFile] = jsInput.value;
          activeFile = filename;
          renderTree();
          activeFileName.textContent = activeFile;
          jsInput.value = files[activeFile] || '';
          doTranspile();
        };

        fileTree.appendChild(item);
      });
    }

    addFileBtn.onclick = () => {
      const name = prompt('請輸入要新增在 src/ 下的模組檔名 (例如 utils.js):', 'utils.js');
      if (name && name.trim()) {
        let validName = name.trim();
        if (!validName.endsWith('.js')) validName += '.js';
        if (files[validName]) {
          alert('該檔名已存在！');
          return;
        }
        const baseName = validName.replace('.js', '');
        files[validName] = `/**\n * ${baseName} 模組\n */\nexport function helper() {\n  return "來自 ${validName}";\n}\n`;
        activeFile = validName;
        renderTree();
        activeFileName.textContent = activeFile;
        jsInput.value = files[activeFile];
        doTranspile();
      }
    };

    // Handle template changes
    templateSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      if (TEMPLATES[selected]) {
        files = JSON.parse(JSON.stringify(TEMPLATES[selected]));
        activeFile = Object.keys(files)[0] || 'main.js';
        renderTree();
        activeFileName.textContent = activeFile;
        jsInput.value = files[activeFile];
        doTranspile();
      }
    });

    // Handle input with debounce
    jsInput.addEventListener('input', () => {
      files[activeFile] = jsInput.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(doTranspile, 250);
    });

    // Handle Tab key in textarea
    jsInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = jsInput.selectionStart;
        const end = jsInput.selectionEnd;
        jsInput.value = jsInput.value.substring(0, start) + '  ' + jsInput.value.substring(end);
        jsInput.selectionStart = jsInput.selectionEnd = start + 2;
        files[activeFile] = jsInput.value;
        doTranspile();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runRustCode();
      }
    });

    // Call local transpile API
    async function doTranspile() {
      try {
        transpileStatus.textContent = '轉譯中...';
        transpileStatus.style.color = '#58a6ff';

        const res = await fetch('/api/transpile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ files })
        });

        const data = await res.json();
        if (data.error) {
          transpileStatus.textContent = '轉譯語法錯誤';
          transpileStatus.style.color = '#f85149';
          rustCode.textContent = `// 轉譯錯誤:\n// ${data.error}`;
        } else {
          currentRustCode = data.rust;
          rustCode.textContent = data.rust;
          transpileStatus.textContent = '轉譯完成';
          transpileStatus.style.color = '#3fb950';
          hljs.highlightElement(rustCode);
        }
      } catch (err) {
        transpileStatus.textContent = '連線失敗';
        transpileStatus.style.color = '#f85149';
      }
    }

    // Run Rust code via online compiler API
    async function runRustCode() {
      if (!currentRustCode || currentRustCode.trim() === '') {
        alert('請先輸入 JavaScript 程式碼以產生 Rust！');
        return;
      }

      runBtn.disabled = true;
      runIcon.innerHTML = '<span class="spinner"></span>';
      execBadge.className = 'status-tag status-running';
      execBadge.textContent = '編譯並執行中...';
      terminalOutput.innerHTML = '<span class="stderr-text">正在向官方 Rust Playground 發送請求編譯並執行...</span>';

      try {
        const payload = {
          channel: "stable",
          mode: "debug",
          edition: "2021",
          crateType: "bin",
          tests: false,
          code: currentRustCode
        };

        const res = await fetch('https://play.rust-lang.org/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
          execBadge.className = 'status-tag status-success';
          execBadge.textContent = '執行成功 (Status: 0)';

          let outputHtml = '';
          if (data.stdout) {
            outputHtml += `<div class="stdout-text"><strong>[執行輸出 stdout]:</strong>\n${escapeHtml(data.stdout)}</div>\n`;
          }
          if (data.stderr) {
            outputHtml += `<div class="stderr-text"><strong>[編譯訊息 stderr]:</strong>\n${escapeHtml(data.stderr)}</div>`;
          }
          terminalOutput.innerHTML = outputHtml || '<span class="stdout-text">程式執行完畢，無輸出內容。</span>';
        } else {
          execBadge.className = 'status-tag status-error';
          execBadge.textContent = '編譯/執行失敗';
          terminalOutput.innerHTML = `<div class="error-text"><strong>[錯誤訊息]:</strong>\n${escapeHtml(data.stderr || data.stdout || '未知錯誤')}</div>`;
        }
      } catch (err) {
        execBadge.className = 'status-tag status-error';
        execBadge.textContent = '連線錯誤';
        terminalOutput.innerHTML = `<div class="error-text">無法連接到 Rust Playground API: ${escapeHtml(err.message)}</div>`;
      } finally {
        runBtn.disabled = false;
        runIcon.textContent = '▶';
      }
    }

    runBtn.addEventListener('click', runRustCode);

    copyBtn.addEventListener('click', () => {
      if (!currentRustCode) return;
      navigator.clipboard.writeText(currentRustCode).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✓ 已複製！';
        setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
      });
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial Load
    renderTree();
    activeFileName.textContent = activeFile;
    jsInput.value = files[activeFile];
    doTranspile();
  </script>
</body>
</html>
