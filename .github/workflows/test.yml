name: Transpiler regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run test:rust
