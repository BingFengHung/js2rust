name: Documentation examples
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/docs.yml'
  push:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/docs.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: rustup default stable && npm run docs:verify
